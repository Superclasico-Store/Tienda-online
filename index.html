
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Online - Boca y River</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

nav{
    background:#0047AB;
    text-align:center;
    padding:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

.banner{
    background:linear-gradient(90deg,#0033A0,#FFD700,#D50032);
    color:white;
    text-align:center;
    padding:50px 20px;
}

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    border-radius:10px;
}

.precio{
    color:green;
    font-size:22px;
    font-weight:bold;
}

button{
    background:#25D366;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}
</style>

</head>
<body>

<header>
<h1>Tienda Online</h1>
<p>Productos de Boca Juniors y River Plate</p>
</header>

<nav>
<a href="#">Inicio</a>
<a href="#">Boca</a>
<a href="#">River</a>
<a href="#">Contacto</a>
</nav>

<section class="banner">
<h2>¡Bienvenido!</h2>
<p>Encontrá camisetas, shorts, conjuntos y mucho más.</p>
</section>

<section class="productos">

<div class="card">
<img src="https://via.placeholder.com/300x300?text=Producto+1">
<h3>Camiseta Boca</h3>
<p class="precio">$35.000</p>
<button>Consultar por WhatsApp</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300?text=Producto+2">
<h3>Camiseta River</h3>
<p class="precio">$35.000</p>
<button>Consultar por WhatsApp</button>
</div>

</section>

<footer>
© 2026 Tienda Online - Todos los derechos reservados.
</footer>

</body>
</html>
